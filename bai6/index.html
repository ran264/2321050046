<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai 6</title>
    <style>
        .khoi1{
            background-color: yellow;
        }
        .khoi2{
            /* 1 giá trị: cách đều xung quannh  */
            /* 2 giá trị: giá trị đầu( trên , dưới ) - giá trị 2 ( trái , phải) */
            /* 4 giá trị: theo thứ tự trên phải dưới trái */
            background-color:aqua;
            margin:50px 200px;
            padding: 50px;
        }
        .khoi3{
            background-color:blueviolet;
        }
        .khoi4{
            display: flex;
        }
        .khoi6{
            background-color: purple;
            width: 50%;
        }
        .khoi5{
            background-color: brown;
            width: 50%;
        }
    </style>
</head>
<body>
    <div class="khoi1">Khoi 1</div>
    <div class="khoi2">Khoi 2</div>
    <div class="khoi3">Khoi 3</div>
    <div class="khoi4">
        <div class="khoi5">Khoi 5</div>
        <div class="khoi6">Khoi 6</div>
    </div>
</body>
</html>
