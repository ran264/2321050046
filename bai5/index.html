<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai5</title>
    <style>
        h2{
            /* color màu chữ  */
            color:red;
        }
        #title{
            color:yellow;
        }
    </style>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <!-- Kiểu 1 viết type trong thẻ -->
     <h1 style="color:blue">HUMG</h1>

    <!-- kiểu 2  -->
     <h2>Mỏ Địa Chất</h2>

    <h3>Lớp phát triển ứngd dụng Web</h3>
    <!-- II selector -->
    <!-- Cách 1: dùng tên thẻ -->
    
    <!-- cách 2 : dùng id -->
    <h2 id ="title">Trường Đại học Mỏ - Địa Chất</h2>

    <!-- cách 3: dùng class -->
    <h2 id ="title" class="title" style="color: pink">Trường Đại học Mỏ - Địa Chất</h2>

    <h3 class="title2">Lớp học </h3>
</body>
</html>
